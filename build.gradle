plugins {
    id "architectury-plugin" version "3.4.164"
    id "dev.architectury.loom" version "1.11.458" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}


def addonNames = ["arsenal", "archery", "armory"] as Set
def includedAddons = gradle.includedBuilds.findAll { addonNames.contains(it.name) }


def installAddon = { String addonName ->
    def mergedDir = rootProject.file("${addonName}/Merged")
    if (!mergedDir.isDirectory()) {
        throw new GradleException("No merged build directory found for ${addonName}: ${mergedDir}")
    }

    def jars = mergedDir.listFiles() ?: []
    def findLatest = { String suffix ->
        def candidates = jars.findAll { it.isFile() && it.name.endsWith(suffix) }
        if (candidates.isEmpty()) {
            throw new GradleException("No ${suffix} jar found in ${mergedDir} for ${addonName}")
        }
        candidates.max { it.lastModified() }
    }

    def targets = [
            ["fabric",   findLatest("fabric.jar")],
            ["neoforge", findLatest("neoforge.jar")]
    ]

    targets.each { platform, jarFile ->
        def localName = rootProject.file("${platform}/libs/${addonName}-local.jar")

        copy {
            from jarFile
            into localName.parentFile
            rename { addonName + "-local.jar" }
        }

        copy {
            from jarFile
            into rootProject.file("Merged")
        }
    }

    // The common project uses the NeoForge jar for local common-side resolution.
    copy {
        from targets.find { it[0] == "neoforge" }[1]
        into rootProject.file("common/libs")
        rename { addonName + "-local.jar" }
    }

    println "Installed ${addonName} addon jars"
}

includedAddons.each { includedBuild ->
    def addonName = includedBuild.name
    def taskSuffix = addonName.capitalize()

    tasks.register("rebuild${taskSuffix}") {
        group = "_tm_tasks"
        description = "Build and install the ${addonName} addon"
        dependsOn includedBuild.task(":buildBoth")
        doLast {
            installAddon(addonName)
        }
    }
}

tasks.register("clean-builds") {
    group = "_tm_tasks"
    description = "Clean the Fabric and NeoForge API builds"
    dependsOn ":fabric:clean", ":neoforge:clean"
}

tasks.register("buildBoth") {
    group = "_tm_tasks"
    description = "Build and merge the Fabric and NeoForge API jars"
    dependsOn ":fabric:build", ":neoforge:build"

    doLast {
        def modVersion = rootProject.mod_version
        def minecraftVersion = rootProject.minecraft_version
        def outputDir = rootProject.file("Merged")

        [
                ["fabric",   project(":fabric")],
                ["neoforge", project(":neoforge")]
        ].each { platform, platformProject ->
            def jarFiles = platformProject.file("build/libs").listFiles() ?: []
            def jarFile = jarFiles.find { it.isFile() && it.name.endsWith("${modVersion}.jar") }

            if (!jarFile) {
                throw new GradleException("Could not find ${platform} build jar in ${platformProject.file('build/libs')}")
            }

            copy {
                from jarFile
                into outputDir
                rename {
                    "Truly-Modular-miapi-${modVersion}-${minecraftVersion}-snapshot-${platform}.jar"
                }
            }
        }

        println "Merged Fabric and NeoForge builds"
    }
}

subprojects {
    apply plugin: "dev.architectury.loom"
    apply plugin: "architectury-plugin"
    apply plugin: "java"
    apply plugin: "maven-publish"

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"

        def parchmentMinecraftVersion = rootProject.findProperty("parchment_minecraft_version") ?: rootProject.minecraft_version
        def parchmentVersion = rootProject.findProperty("parchment_version") ?: "2024.11.17"

        mappings loom.layered() {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${parchmentMinecraftVersion}:${parchmentVersion}@zip")
        }
    }

    base {
        archivesName = rootProject.archives_base_name
    }
    version = rootProject.mod_version
    group = rootProject.maven_group

    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.parchmentmc.org" }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
        withSourcesJar()
        withJavadocJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = 21
    }

    tasks.withType(Javadoc).configureEach {
        options.addStringOption("Xdoclint:none", "-quiet")
        failOnError = false
    }

    tasks.named("processResources") {
        def expandProps = [
                "version"                      : rootProject.mod_version,
                "group"                        : project.group,
                "minecraft_version"            : rootProject.minecraft_version,
                "architectury_version"         : rootProject.architectury_version,
                "neoforge_version"             : rootProject.neoforge_version,
                "neoforge_loader_version_range": rootProject.neoforge_loader_version_range,
                "neoforge_version_range"       : rootProject.neoforge_version_range,
                // The existing resource templates expect this value to be the Minecraft version.
                "minecraft_version_range"      : rootProject.minecraft_version,
                "fabric_api_version"           : rootProject.fabric_api_version,
                "fabric_loader_version"        : rootProject.fabric_loader_version,
                "mod_name"                     : rootProject.mod_name,
                "mod_author"                   : rootProject.mod_author,
                "mod_id"                       : rootProject.mod_id,
                "mod_description"              : rootProject.mod_description,
                "credits"                      : rootProject.credits
        ]

        inputs.properties(expandProps)

        filesMatching(["pack.mcmeta", "fabric.mod.json", "META-INF/neoforge.mods.toml", "*.mixins.json"]) {
            expand expandProps
        }
    }
}
